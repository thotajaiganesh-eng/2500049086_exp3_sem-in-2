<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><header><div class="brand">🎓 Student Portal</div><p>Your personal academic dashboard</p></header><main>
<section class="card" id="auth"><div class="tabs"><button class="tab active" data-panel="login">Login</button><button class="tab" data-panel="register">Register</button></div><form id="loginForm"><h2>Welcome back</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="primary">Login</button></form><form id="registerForm" class="hidden"><h2>Create account</h2><label>Full name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="8"></label><button class="primary">Register</button></form><p id="message"></p></section>
<section id="dashboard" class="hidden"><div class="card dashboard-head"><div><h2 id="welcome">Dashboard</h2><p>Add and manage your own data. It is saved to MongoDB.</p></div><button id="logout" class="secondary">Logout</button></div><div class="tabs dash-tabs"><button class="tab active" data-view="profile">My Profile</button><button class="tab" data-view="courses">My Courses</button><button class="tab" data-view="records">Academic Records</button></div>
<section class="card view" id="profileView"><h2>Personal Details</h2><form id="profileForm" class="grid"><label>Full Name<input name="name" required></label><label>Email<input name="email" disabled></label><label>Roll Number<input name="rollNumber"></label><label>Department<input name="department"></label><label>College Name<input name="college"></label><label>Year of Study<input name="yearOfStudy"></label><label>Phone Number<input name="phone"></label><button class="primary full">Save Profile</button></form></section>
<section class="card view hidden" id="coursesView"><h2>My Courses</h2><form id="courseForm" class="grid"><label>Course Name<input name="title" required></label><label>Course Code<input name="code"></label><label>Instructor<input name="instructor"></label><label class="wide">Description<textarea name="description"></textarea></label><button class="primary full">Add Course</button></form><div id="courseList" class="items"></div></section>
<section class="card view hidden" id="recordsView"><h2>Academic Records</h2><form id="recordForm" class="grid"><label>Semester<input name="semester" required placeholder="Semester 1"></label><label>GPA (0–10)<input name="GPA" type="number" min="0" max="10" step="0.01" required></label><label>Status<input name="status" placeholder="Completed"></label><label class="wide">Notes<textarea name="notes"></textarea></label><button class="primary full">Save Record</button></form><div id="recordList" class="items"></div></section></section></main><footer>Student Authentication Portal · MongoDB</footer></div><script src="app.js"></script></body></html>
